[project]
name = "careerforge-api"
version = "1.0.0"
description = "CareerForge AI — local-first multi-agent career-intelligence backend (FastAPI)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CareerForge AI" }]
keywords = ["career", "ai", "multi-agent", "fastapi", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]

dependencies = [
    # NOTE: pinned to the stable 0.115.x line on purpose. FastAPI 0.139.x ships a
    # broken `APIRouter`/`include_router` (mounted routers register zero routes),
    # which silently drops the /api/v1/rag/* endpoints. Keep this upper bound
    # until a later release fixes it. starlette is pinned to match.
    "fastapi>=0.115,<0.116",
    "starlette>=0.41,<0.42",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # sse-starlette 3.x requires starlette>=0.49, which conflicts with the
    # FastAPI 0.115 pin above; 2.1.x is the compatible line.
    "sse-starlette>=2.1,<3",
    "httpx>=0.27",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
    # RAG subsystem (Phases 2 & 4). ``rag_core`` is the local sibling package at
    # ``packages/rag_core``; it is installed editable via [tool.uv.sources] below
    # (or `pip install -e ../../packages/rag_core`). Its own runtime deps
    # (qdrant-client, numpy) are pinned here too so the API resolves them even
    # when the sibling package is installed without its dependency metadata.
    "rag_core",
    "qdrant-client>=1.12",
    "numpy>=1.26",
]

# Resolve the local ``rag_core`` package from the monorepo path when using uv.
# Plain pip users install it explicitly with:
#   pip install -e ../../packages/rag_core
[tool.uv.sources]
rag_core = { path = "../../packages/rag_core", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/careerforge-ai/careerforge-ai"
Repository = "https://github.com/careerforge-ai/careerforge-ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["careerforge_api"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["careerforge_api", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
]
ignore = [
    "B008",    # function call in default argument (FastAPI Depends/File patterns)
    "UP042",   # `str, Enum` is intentional for transparent Pydantic/JSON enum values
    "RUF012",  # mutable class attrs are Pydantic model fields, not shared state
    "RUF022",  # `__all__` is grouped by API-contract section on purpose, not sorted
]

[tool.ruff.lint.per-file-ignores]
# These modules embed intentional long-form content: realistic finding
# summaries, diff snippets, and seed evidence text. Those string literals
# should read naturally rather than be wrapped mid-sentence, and some quote
# examples of *bad* code (e.g. a bare `except:`) as the thing being reported.
"careerforge_api/simulation.py" = ["E501", "E722"]
"careerforge_api/seed_data.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["careerforge_api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# mypy — static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# `explicit_package_bases` + `mypy_path` let mypy resolve modules as
# `careerforge_api.*` whether it is invoked as `mypy careerforge_api`,
# `mypy .`, or `mypy -p careerforge_api`, avoiding the
# "Source file found twice under different module names" error.
explicit_package_bases = true
mypy_path = "."
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["psutil.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
