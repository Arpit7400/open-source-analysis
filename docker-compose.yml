# =============================================================================
# CareerForge AI — OPTIONAL full real-services stack
# =============================================================================
# The flagship demo does NOT require any of this. Demo mode (APP_ENV=demo, the
# default) runs the entire mission simulation with ONLY Python + Node — no
# Docker, no database, no vector store, no GPU.
#
# This compose file exists so that a future phase (APP_ENV=local) can bring up
# the real backing services the architecture targets. Every image is pinned to
# a specific tag for reproducibility. Bring up a subset with, e.g.:
#
#     docker compose up -d postgres qdrant redis
#
# To run everything:
#
#     docker compose up -d
#
# After the services are healthy, point the backend at them by setting
# CAREERFORGE_APP_ENV=local in your .env, then start the API and web app as
# usual. See docs/NEXT_PHASE.md for wiring details.
# =============================================================================

name: careerforge-ai

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Profile Brain, missions, findings, candidates, evidence
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerforge
      POSTGRES_PASSWORD: careerforge
      POSTGRES_DB: careerforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerforge -d careerforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Qdrant — vector store for RAG (evidence + industry-pulse embeddings)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.3
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — task queue / cache / SSE fan-out backplane
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Temporal — durable, long-running mission workflows
  # (uses its own bundled PostgreSQL settings against the `postgres` service)
  # ---------------------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.25.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: careerforge
      POSTGRES_PWD: careerforge
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  # ---------------------------------------------------------------------------
  # Langfuse — LLM tracing / observability for agent prompts + tool calls
  # ---------------------------------------------------------------------------
  langfuse:
    image: langfuse/langfuse:2.93.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://careerforge:careerforge@postgres:5432/careerforge
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: change-me-in-a-real-deployment
      SALT: change-me-in-a-real-deployment
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"

  # ---------------------------------------------------------------------------
  # Prometheus — metrics scraping (API, workers, resource gauges)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    # Mount a prometheus.yml here in a future phase:
    #   volumes:
    #     - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus

  # ---------------------------------------------------------------------------
  # Grafana — dashboards over Prometheus metrics
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana

# -----------------------------------------------------------------------------
# Note: Ollama (the local Model Gateway) is intentionally NOT included here.
# GPU passthrough is host-specific and cross-platform Docker GPU support is
# uneven; run Ollama natively (https://ollama.com) and point
# CAREERFORGE_OLLAMA_URL at it. See docs/NEXT_PHASE.md.
# -----------------------------------------------------------------------------

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  prometheus_data:
  grafana_data:
