[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandbox"
version = "0.1.0"
description = "Restricted repository sandbox for CareerForge AI (Phase 6): static safety preflight, command policy, non-root Docker execution."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arpit Sahu" }]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["sandbox"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TC", "RUF"]
ignore = ["E501", "UP042", "RUF022", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["sandbox"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
