[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "static_analysis"
version = "0.1.0"
description = "Real static-analysis agents for CareerForge AI (Phase 5): ruff, mypy, and AST-based checks producing typed Findings."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arpit Sahu" }]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# ruff/mypy are invoked as subprocesses if present on PATH; listed here so a
# dev environment has them. The AST analyzers need no external tools.
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["static_analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TC", "RUF"]
ignore = [
    "E501",
    "UP042",
    "RUF022",
    "TC001",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["static_analysis"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
