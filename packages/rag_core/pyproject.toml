[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag_core"
version = "0.1.0"
description = "Real RAG + code-indexing subsystem for CareerForge AI (embeddings, vector search, AST indexing, hybrid retrieval, reranking, citations, claim verification)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Arpit Sahu" }]
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "qdrant-client>=1.12",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["rag_core"]

# --- Ruff (mirrors apps/api style) -----------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["rag_core", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "UP042",  # `str, Enum` is intentional for transparent JSON enum values
    "RUF022", # `__all__` grouped by contract section on purpose, not sorted
    "RUF002", # ambiguous unicode in docstrings (e.g. math "×") is deliberate
    "RUF046", # int() wrapping kept for explicitness/readability
    # TC001/TC003: several "type-only" imports (Chunk, RetrievedChunk,
    # RagSettings, Embedder, ...) are also used at runtime in these modules, so
    # moving them under TYPE_CHECKING would break imports. Keep them at module
    # scope where they are genuinely needed at runtime.
    "TC001",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["rag_core"]

[tool.ruff.format]
quote-style = "double"

# --- Mypy (mirrors apps/api style) -----------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*"]
ignore_missing_imports = true

# --- Pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
